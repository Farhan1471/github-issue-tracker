<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tawilwind + Daisyui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- Fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Home</title>
    <style>
        *{
             font-family: "Outfit", sans-serif;
        }
    </style>
  </head>
  <body class="bg-[#F8FAFC]">
    <!-- navigation bar -->
    <div class="navbar bg-base-100 shadow-sm flex flex-col sm:flex-row px-2 gap-3 py-2 justify-between px-12">
        <div class="flex justify-center items-center gap-2">
            <img src="./assets/github-logo.png" height="36px" width="36px" alt="">
            <p class="text-lg font-semibold">GitHub Issues Tracker</p>
        </div>
        <div class="flex gap-2">
            <label class="input input-bordered flex items-center gap-2 w-64">
                <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                <input id="searchInput" type="text" class="grow" placeholder="Search Issues..." />
            </label>
            <button id="searchBtn" class="btn btn-primary">Search</button>
            <button class="btn btn-primary">+ New Issue</button>
        </div>
    </div>

    <!-- Tab button section -->
    <div id="tab-container" class="bg-white shadow rounded-lg flex gap-2 mt-12 py-6 pl-6 max-w-[1110px] w-full mx-auto">
        <button id="all-issues" class="bg-[#4A00FF] border-1 border-[#E4E4E7] text-white px-8 py-2 rounded">All</button>
        <button id="openIssues" class="bg-white shadow border-1 border-[#E4E4E7] text-black px-8 py-2 rounded">Open</button>
        <button id="closedIssues" class="bg-white shadow border-1 border-[#E4E4E7] text-black px-8 py-2 rounded">Closed</button>
    </div>

    <!-- Issue Heading -->
     <div class="bg-white shadow rounded-lg flex flex-col sm:flex-row gap-2 mt-4 py-6 pl-6 max-w-[1110px] w-full mx-auto justify-between items-center">
        <div class="flex justify-center items-center gap-2">
            <div class="bg-[#ECE4FF] p-3 rounded-full">
                <img src="./assets/Aperture.png" alt="">
            </div>
            <div>
                <h3 id="numberOfIssue" class="font-semibold text-xl"></h3>
                <p class="text-[#64748B]">Track and manage your project issues</p>
            </div>
        </div>

        <div class="flex justify-center items-center gap-4 pr-6">
            <div class="flex gap-2 justify-center items-center">
                <div class="w-3 h-3 bg-[#00A96E] rounded-full"></div>
                <p>Open</p>
            </div>
            <div class="flex gap-2 justify-center items-center">
                <div class="w-3 h-3 bg-[#A855F7] rounded-full"></div>
                <p>Close</p>
            </div>
        </div>
    </div>

    <!-- Issue Card -->
     <div id="issueContainer" class="bg-white grid lg:grid-cols-4 md:grid-cols-2 sm:grid-cols-1 shadow rounded-lg flex max-w-[1110px] w-full gap-1 mt-4 py-6 px-5 mx-auto justify-center">
        <!-- cards will append here -->
     </div>


    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="h-[60vh] justify-center items-center hidden">
        <span class="loading loading-spinner loading-lg"></span>
    </div>

    <!-- Modal -->
    <dialog id="issue_details_modal" class="modal">
        
    </dialog>

     <script src="./script/home.js"></script>
  </body>
</html>
