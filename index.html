<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tawilwind + Daisyui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Login</title>
    <style>
        *{
             font-family: "Outfit", sans-serif;
        }
    </style>
  </head>
  <body class="flex items-center justify-center min-h-screen bg-[#F8FAFC]">
    <!-- card div -->
    <div class="card w-full shadow max-w-sm bg-white">
        <div class="mx-auto pt-8">
            <div class="logo flex justify-center">
                <img src="./assets/github-logo.png" alt="">
            </div>
            <div class="text-center pt-6">
                <h3 class="text-xl font-semibold">GitHub Issues Tracker</h3>
                <p class="text-[#64748B] text-sm">Sign in to manage your issues</p>
            </div>
        </div>

        <div class="form pt-2">
            <div class="w-full max-w-sm shrink-0 mx-auto rounded-2xl">
                <div class="card-body">
                    <fieldset class="fieldset">
                    <label class="label text-neutral font-semibold">Username</label>
                    <input id="input-username"type="text" class="input rounded-lg bg-white" placeholder="Enter Username"/>
                    <p class="text-[#4A00FF] mb-2">Default: admin</p>
                    <label class="label text-neutral font-semibold">Password</label>
                    <input id="input-password" type="password" class="input rounded-lg bg-white" placeholder="Enter Password" />
                    <p class="text-[#4A00FF] mb-2">Default: admin123</p>
                    <button id="signin-btn" class="btn btn-primary rounded-lg">Sign In</button>
                    <div class="flex items-center my-2">
                        <hr class="w-full text-[#E4E4E7]">
                        <span class="px-2">OR</span>
                        <hr class="w-full text-[#E4E4E7]">
                    </div>
                    <p class="text-center text-[#64748B]">Demo Credentials:</p>
                    <div class="bg-[#F8FAFC] py-4 w-full text-center text-sm">
                        <p><strong>Username:</strong> admin</p>
                        <p><strong>Password:</strong> admin123</p>
                    </div>
                    </fieldset>
                </div>
            </div>
        </div>
    </div>
    <script src="./script/login.js"></script>
  </body>
</html>
